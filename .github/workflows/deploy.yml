name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/serverless-web-app-o5bx07
  workflow_dispatch:

# GITHUB_TOKEN이 Pages에 배포할 수 있도록 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 하나의 배포만 실행 (진행 중 배포는 중단하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 서버(실시간) 기능을 쓰려면 저장소 Settings → Secrets and variables → Actions →
          # Variables 에 VITE_API_BASE = 배포한 Worker 주소 를 추가하세요. 없으면 서버리스로만 동작.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # SPA 라우팅 폴백: /draw/:id 등 깊은 링크로 직접 접속해도
      # GitHub Pages가 404.html(=index.html)을 내려주고 React Router가 처리
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        # enablement: true → Pages가 아직 켜져 있지 않으면 워크플로우 소스로 자동 활성화
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
